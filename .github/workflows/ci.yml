name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (Zig ${{ matrix.zig }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.16.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: zig version
        run: zig version

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all
